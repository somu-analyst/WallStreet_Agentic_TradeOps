# base was hardcoded "dark" with dark colors always -- Streamlit's NATIVE widgets
# (dataframe grid, dropdown/selectbox chrome) read THIS config-level theme directly,
# not page CSS, so the app's own Light/Dark toggle (_CSS_LIGHT/_CSS_DARK in dashboard.py)
# could only ever patch CSS-reachable elements -- native tables/dropdowns stayed dark
# even in "Light" mode (user 2026-07-24: "tables showing as black background white
# letters" in light mode). Light is the actual default (_load_saved_theme() default),
# so the base now matches it; dark mode's CSS layer already overrides these to match.
[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#f4f5f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a2332"
font = "sans serif"
# The native dataframe grid (st.dataframe) is canvas-rendered (glide-data-grid) and reads
# these theme keys DIRECTLY -- page CSS (dashboard.py's .stDataFrame border rule) cannot
# reach its internal row/column gridlines, only the outer HTML wrapper. This is the actual
# fix for "table rows and columns black" (user 2026-07-24) applying to every st.dataframe
# table in the app, not just plain HTML/markdown tables.
borderColor = "#000000"
dataframeBorderColor = "#000000"

[client]
showErrorDetails = true

[server]
enableStaticServing = true
